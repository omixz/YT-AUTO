name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to Ubuntu 26 (Oct 2026); apt package names (ffmpeg, espeak-ng, libegl1) and skia/torch wheels are verified on 24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libfontconfig1

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest ruff

      # Only the high-signal rules (syntax errors, undefined names, bad
      # comparisons) so this gates real bugs without a style-cleanup PR first.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .

      - name: Test
        run: python -m pytest -q
