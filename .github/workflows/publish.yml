name: Publish automated YouTube video

on:
  schedule:
    # Daily at 13:00 UTC. Scheduled (cron) runs publish IMMEDIATELY - see the
    # `--publish-now` fallback in the "Run pipeline" step - so go-live is
    # 13:00 UTC plus build time. scheduling.py's optimal-slot logic only
    # applies to a manual dispatch with publish_now unchecked.
    - cron: "0 13 * * *"
    # A Short every evening (forced via the schedule string below; the longform bandit never picks shorts)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Override topic (leave blank to pull from the queue)"
        required: false
        default: ""
      format:
        description: "Force a format instead of letting the bandit pick (leave blank for normal behavior)"
        required: false
        default: ""
        type: choice
        options: ["", "shorts", "longform"]
      dry_run:
        description: "Build the video but skip uploading to YouTube"
        required: false
        default: "false"
        type: boolean
      publish_at:
        description: "RFC3339 time to schedule the release (overrides the auto-picked optimal slot)"
        required: false
        default: ""
      publish_now:
        description: "Release immediately as public (default). Uncheck to schedule the next optimal slot instead."
        required: false
        default: "true"
        type: boolean
      unschedule_video_id:
        description: "Admin: set this video ID to private (pulls back a scheduled/public video) and skip the normal pipeline run entirely"
        required: false
        default: ""

permissions:
  contents: write
  issues: write   # lets the report step open a review issue when the quality gate trips

# Publish and analytics-sync both commit state back to main. Sharing one
# group serializes them, so two runs can never double-publish or race on
# `git push`. Queued runs wait instead of being cancelled mid-upload.
concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # a 20-min longform render is slow, but a hung run shouldn't burn minutes forever
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libegl1 libgl1 libfontconfig1

      - name: Cache Kokoro model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Install Python dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-kokoro.txt

      - name: Restore YouTube OAuth credentials
        run: |
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}" | base64 -d > client_secret.json
          echo "${{ secrets.YOUTUBE_TOKEN_B64 }}" | base64 -d > token.json

      - name: Unschedule video (admin)
        if: ${{ github.event.inputs.unschedule_video_id != '' }}
        env:
          UNSCHEDULE_VIDEO_ID: ${{ github.event.inputs.unschedule_video_id }}
        run: python publish_now.py "$UNSCHEDULE_VIDEO_ID" --private

      - name: Run pipeline
        if: ${{ github.event.inputs.unschedule_video_id == '' }}
        env:
          # Right-hand side matches this repo's actual secret names
          # (GEMINI_API / PEXELSAPI) - left-hand side stays GEMINI_API_KEY /
          # PEXELS_API_KEY since that's what the Python code reads via os.getenv.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API }}  # legacy secret name still works
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXELSAPI }}  # legacy secret name still works
          # Optional - tts.py falls back to edge-tts automatically if unset.
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # Buffer fallback publish path (buffer_publisher.py/media_host.py)
          # - only exercised when the direct YouTube OAuth upload fails.
          # Safe to leave unset: pipeline.py's fallback then fails with a
          # clear "not configured" error instead of silently no-op'ing.
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          MEDIA_HOST_BUCKET: ${{ secrets.MEDIA_HOST_BUCKET }}
          MEDIA_HOST_ACCESS_KEY: ${{ secrets.MEDIA_HOST_ACCESS_KEY }}
          MEDIA_HOST_SECRET_KEY: ${{ secrets.MEDIA_HOST_SECRET_KEY }}
          MEDIA_HOST_ENDPOINT_URL: ${{ secrets.MEDIA_HOST_ENDPOINT_URL }}
          MEDIA_HOST_REGION: ${{ secrets.MEDIA_HOST_REGION }}
          MEDIA_HOST_PUBLIC_BASE_URL: ${{ secrets.MEDIA_HOST_PUBLIC_BASE_URL }}
          # Manual-dispatch inputs go through env vars, NOT inline ${{ }} in the
          # script below: inline interpolation lets a crafted `topic` value
          # (quotes, $(...), backticks) execute as shell code on the runner.
          SCHEDULE_CRON: ${{ github.event.schedule }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_FORMAT: ${{ github.event.inputs.format }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IN_PUBLISH_AT: ${{ github.event.inputs.publish_at }}
          IN_PUBLISH_NOW: ${{ github.event.inputs.publish_now }}
        run: |
          ARGS=()
          if [ -n "$IN_TOPIC" ]; then
            ARGS+=(--topic "$IN_TOPIC")
          fi
          if [ -n "$IN_FORMAT" ]; then
            ARGS+=(--format "$IN_FORMAT")
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_CRON" = "0 22 * * *" ]; then
            ARGS+=(--format shorts)
          fi
          if [ "$IN_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$IN_PUBLISH_AT" ]; then
            ARGS+=(--publish-at "$IN_PUBLISH_AT")
          else
            # github.event.inputs is entirely absent on `schedule` (cron)
            # triggers - workflow_dispatch's `default:` only applies when
            # someone dispatches manually, so without this fallback the daily
            # cron run would always fall through to the (unset) input being
            # empty/false and get scheduled instead of posted live. Default to
            # publish-now (post as public immediately) unless a specific
            # publish_at was given, or the box was explicitly unchecked on a
            # manual dispatch.
            if [ "${IN_PUBLISH_NOW:-true}" != "false" ]; then
              ARGS+=(--publish-now)
            fi
          fi
          python run_pipeline.py "${ARGS[@]}"

      - name: Report run (job summary + review issue if the quality gate tripped)
        id: report
        if: ${{ always() && github.event.inputs.unschedule_video_id == '' }}
        run: python ci_report.py

      - name: Open review issue for gate-failed video
        if: ${{ steps.report.outputs.needs_review == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # LLM-generated title: env var, never inline-interpolated into the script.
          VIDEO_TITLE: ${{ steps.report.outputs.title }}
        run: |
          gh issue create \
            --title "Review needed: $VIDEO_TITLE" \
            --body-file issue_body.md

      - name: Post dry-run report (so results are readable without opening logs)
        if: ${{ always() && github.event.inputs.dry_run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f run_report.md ] || echo "No manifest was produced - the run failed before finishing." > run_report.md
          gh issue create --title "Dry-run report (run ${{ github.run_id }})" --body-file run_report.md || true

      - name: Remove OAuth credential files before committing
        if: always()
        run: rm -f client_secret.json token.json

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-run-${{ github.run_id }}
          path: output/**
          retention-days: 14

      - name: Commit updated topic queues/history/ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/topics/ config/topic_history/
          # published_videos.json only exists after a real (non-dry-run) upload
          # actually records something - "git add" hard-errors on a pathspec
          # that matches zero files, unlike a directory glob.
          [ -f config/published_videos.json ] && git add config/published_videos.json
          git diff --cached --quiet || git commit -m "chore: update topic queues + growth ledger after automated run"
          # A long run (a big longform video can take a while to render/upload)
          # can easily overlap with an unrelated push landing on main in the
          # meantime, which would make a plain push fail as non-fast-forward
          # and silently lose this run's topic-queue/ledger update. Rebase
          # onto whatever's there now before pushing.
          git pull --rebase origin main
          git push
