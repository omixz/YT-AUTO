name: Roblox story Short (daily, automatic)

# AI-written Roblox story + AI narration + word-by-word captions over obby gameplay.
# Separate from the history pipeline: own config (config/roblox_stories.yaml), own history file.
# Posts to the channel picked in that config; without that channel's token it builds the video
# (kept as an artifact below) and posts nothing.
on:
  schedule:
    - cron: "41 18 * * *"   # 18:41 UTC daily - after school in the US, evening in Europe
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the video but don't post it"
        type: boolean
        default: false

permissions:
  contents: write   # commit config/roblox_stories_history.json

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libfontconfig1
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Restore YouTube credentials
        env:
          CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          MAIN_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          STORIES_TOKEN_B64: ${{ secrets.YOUTUBE_STORIES_TOKEN_B64 }}
        run: |
          [ -n "$CLIENT_SECRET_B64" ] && echo "$CLIENT_SECRET_B64" | base64 -d > client_secret.json
          if grep -qE '^channel:\s*main' config/roblox_stories.yaml; then
            [ -n "$MAIN_TOKEN_B64" ] && echo "$MAIN_TOKEN_B64" | base64 -d > token.json
          else
            [ -n "$STORIES_TOKEN_B64" ] && echo "$STORIES_TOKEN_B64" | base64 -d > stories_token.json
          fi
          true
      - name: Make and post today's story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API }}
          STORIES_GAMEPLAY_URLS: ${{ secrets.STORIES_GAMEPLAY_URLS }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$IN_DRY_RUN" = "true" ]; then python roblox_stories.py --dry-run; else python roblox_stories.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roblox-story-${{ github.run_id }}
          path: |
            output/roblox_stories/*.mp4
            output/roblox_stories/story.json
          retention-days: 14
      - name: Commit story history
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f config/roblox_stories_history.json ] && git add config/roblox_stories_history.json
          git diff --cached --quiet || git commit -m "chore: record today's Roblox story"
          git pull --rebase origin main
          git push
