topics:
- 'The 1961 Project Iceworm whistleblower: how a Danish scientist working in a secret
  US nuclear city beneath the Greenland ice sheet leaked the apocalyptic ''Camp Century''
  blueprint to Copenhagen, triggering a diplomatic firestorm that forced Washington
  to abandon its frozen Doomsday machine.'
- 'The 1981 Able Archer close call: how a terrified CIA analyst named Fritz Ermarth
  convinced a paranoid White House that a routine NATO nuclear war simulation was
  actually a Western cover for a real first strike, nearly provoking a preemptive
  Soviet blitz.'
- 'The 1958 Tybee Island nuclear bomb loss: how an American pilot flying a crippled
  B-47 bomber with a live Mark 15 hydrogen bomb dangling in its bomb bay had to make
  the horrifying choice to ditch the multi-megaton weapon into the shallow coastal
  waters off Georgia before his jet broke apart.'
- 'The 1973 Yom Kippur War intelligence failure: how an Egyptian double agent codenamed
  ''The Angel'' risked his life to hand-deliver a midnight warning to Israeli intelligence
  about an imminent invasion, only to be dismissed by arrogant commanders until the
  first sirens began wailing.'
