topics:
- How a young civilian operator named Norah Clift, working in a remote British radar
  station, spotted the vanguard of the Luftwaffe on her screen during the Battle of
  Britain and had to decide whether to trust her malfunctioning equipment or sound
  the alarm that saved London.
- How Soviet officer Valery Sablin mutinied aboard the nuclear-armed warship Storozhevoy
  in 1975, launching a rogue mission to trigger a second Russian revolution that nearly
  sparked a catastrophic military clash in the Baltic Sea.
