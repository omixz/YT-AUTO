topics:
- The 1961 B-52 crash over Goldsboro, North Carolina, where a dropping nuclear bomb
  had four safety switches and three failed instantly, leaving a single low-voltage
  toggle switch to prevent an accidental detonation over the American mainland.
- How a single intercepted telegram in 1917, sent by German Foreign Minister Arthur
  Zimmermann, tricked the British codebreakers of Room 40 into orchestrating a masterclass
  of deception to drag the United States into World War I.
- How a forgotten Soviet intercept operator named Vasili Chuikov during the 1960 U-2
  spy plane crisis chose to bypass protocol and hold his fire, unknowingly sparing
  Francis Gary Powers from instant vaporization and preventing an immediate Cold War
  escalation.
- The 1942 St. Nazaire Raid, where the British Royal Navy packed an obsolete destroyer
  with five tons of hidden high explosives and deliberately rammed it into a heavily
  fortified German dry dock to cripple Hitler's last Atlantic battleship harbor.
