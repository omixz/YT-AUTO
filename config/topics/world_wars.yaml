topics:
- 'The frozen inkwell of Captain Robert Falcon Scott: The final, agonizing diary entries
  written inside a blizzard-swept tent in Antarctica as his dying expedition realized
  they were beaten to the South Pole by just 34 days.'
- 'The catastrophic miscalculation of Admiral Sir George Tryon: The bizarre peacetime
  maneuver off the coast of Tripoli where a legendary Royal Navy commander stubbornly
  ordered two massive battleships to turn directly into each other, watched in horror
  by hundreds of sailors on deck.'
