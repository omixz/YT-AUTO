topics:
- "The harrowing escape of Belgian King Albert I\u2019s secret courier, who swam the\
  \ freezing Yser River under German searchlights to deliver the flood orders that\
  \ saved the last slice of Belgium in 1914."
- The extreme, claustrophobic reality of a German U-boat cook during WWII, managing
  a tiny, grease-slicked galley while depth charges rattled the hull and oxygen slowly
  ran out.
- "The high-stakes gamble of Spanish double agent Juan Pujol Garc\xEDa (Garbo), who\
  \ had to invent a fake network of 27 sub-agents and convince the Nazi high command\
  \ that the D-Day landings were a mere diversion."
- The tragic mistake of British Admiral Archibald Berkeley Milne, whose hesitation
  and misread signals allowed the German battlecruiser SMS Goeben to escape to Constantinople,
  ultimately dragging the Ottoman Empire into WWI.
