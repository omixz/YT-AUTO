topics:
- 'The 1916 Battle of the Somme soccer ball charge: How British captain Wilfred Nevill
  kicked footballs across No Man\''s Land under machine-gun fire to rally his demoralized
  men, turning a doomed assault into a surreal slaughter.'
- 'The forged telegram that doomed the Romanovs: How a single fabricated wire in 1918
  convinced Bolshevik guards that a rescue squad was seconds away, triggering the
  hurried, brutal execution of the entire Russian imperial family in a basement.'
- 'The blind telegrapher of Pearl Harbor: How a visually impaired civilian warning
  operator picked up anomalous radar blips hours before the attack, only to be ignored
  by commanders who assumed it was just incoming American B-17 bombers.'
- 'The rogue submarine commander who accidentally started the Pacific War: How Dutch
  Lieutenant Commander A.A. Mulder sank a Japanese ship off Malaya hours *before*
  Pearl Harbor, forcing Tokyo\''s hand and altering the global timeline of WWII.'
