topics:
- The harrowing journey of a Persian 'Chapar Khaneh' royal mail courier who had to
  ride through a blinding sandstorm in the Zagros Mountains to deliver a message of
  impending rebellion, knowing failure meant execution.
- The high-stakes survival story of a Greek 'Katadotes' (professional diver) hired
  by the Athenian navy to sabotage Persian warship anchor ropes in the pitch-black,
  freezing depths of the Aegean Sea.
