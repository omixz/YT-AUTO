topics:
- The terrifying midnight shift of a Roman 'Libitinarius' (undertaker's assistant)
  in the Subura slums who accidentally dropped a plague victim's corpse down a dry
  well, risking a city-wide contagion and a death sentence from the urban praetor.
- "The desperate morning of a Viking '\xDEr\xE6ll' (slave) in Hedeby who discovered\
  \ his master's silver hoard was missing just as the local Thing (assembly) convened,\
  \ forcing him to steal a sacred temple goat as a replacement sacrifice to escape\
  \ being buried alive."
- The high-tension ordeal of a Han Dynasty 'Tingzhang' (post-station master) along
  the Hexi Corridor who had to decipher a faded bamboo slip message during a flash
  flood warning, knowing a single misread character would send thousands of border
  troops into an ambush by the Xiongnu.
- The heart-stopping gamble of an ancient Mesopotamian beer brewer in Lagash who realized
  her entire batch had turned sour with mold on the eve of the royal festival, forcing
  her to invent the first-ever improvised filtration system using river reeds before
  the temple guards inspected her vats.
