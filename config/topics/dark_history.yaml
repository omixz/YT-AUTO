topics:
- 'The Mad Gasser of Mattoon: During WWII in Illinois, an entire town was gripped
  by mass hysteria and terror over an elusive phantom attacker who allegedly sprayed
  a paralyzing, sweet-smelling gas into people''s bedroom windows.'
- "The 1902 eruption of Mount Pel\xE9e and the survival of Ludger Sylbaris: A devastating\
  \ volcanic eruption wiped out an entire Caribbean city of 30,000 people in minutes,\
  \ leaving only a convicted murderer saved by the thick walls of his poorly ventilated\
  \ dungeon cell."
- "The execution of Gy\xF6rgy D\xF3zsa: In 1514, after leading a failed peasant rebellion\
  \ in Hungary, the charismatic leader was condemned by the nobility to sit on a red-hot\
  \ iron throne and crowned with a burning iron crown, while his starving followers\
  \ were forced to eat his flesh."
- "The deadly panic of the 1897 Bazar de la Charit\xE9 fire: A devastating blaze sparked\
  \ by a cinematograph projectionist's mistake trapped Paris's high-society elite\
  \ inside a wooden bazaar, leading to a brutal, every-man-for-himself struggle for\
  \ survival in the heart of the Belle \xC9poque."
