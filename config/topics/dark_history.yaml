topics:
- "The 1916 New Jersey Shark Attacks and the Red Scare of the Sea: Over a single hot\
  \ July week, a rogue shark attacks five people along the Jersey Shore\u2014including\
  \ miles inland up a freshwater creek\u2014unleashing a national panic that drove\
  \ armed mobs into the water with pitchforks and dynamite."
- "The M\xFCnster Rebellion of 1534: An extremist tailor named John of Leiden seizes\
  \ control of a German city, declares himself the King of the New Jerusalem, outlaws\
  \ private property, forces polygamy under pain of death, and starves his citizens\
  \ before being publicly tortured with red-hot tongs and left in hanging iron cages."
