priority:
- The 1928 kidnapping and baffling return of 4-year-old Barbara Gansert in Baltimore,
  Maryland, where a frantic mother opened her front door to find her missing daughter
  neatly dressed in brand-new clothes she had never owned, accompanied by a polite
  stranger who vanished into the fog before he could be questioned.
topics:
- 'The 1930 St. Kilda Evacuation: The haunting final hours of an isolated Scottish
  island community as the last 36 residents packed their belongings, leaving behind
  a smoking peat fire and a bible open in an empty church.'
