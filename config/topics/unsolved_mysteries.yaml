topics:
- The haunting 2001 case of the Isdal Woman in Norway, found burned in a remote ravine
  with all clothing tags meticulously cut out, a customized binocular strap, and a
  coded diary that took decades to crack
- The chilling 1989 disappearance of Tammy Belanger, who vanished from her New Hampshire
  home in the dead of winter, leaving behind footprints that abruptly stopped in the
  middle of an untouched snowy field as if she vanished into thin air
- The bizarre 1978 Dyatlov Pass-style mystery of the five boys who abandoned their
  warm cabin in the remote Soviet Ural mountains during a blizzard, fleeing barefoot
  into freezing snowdrifts without their boots or coats for reasons that remain entirely
  unexplained
- "The tragic 1999 disappearance of Amy Lynn Bradley from a Royal Caribbean cruise\
  \ ship, leaving behind only her cigarettes and lighter before multiple passengers\
  \ allegedly spotted her years later being sold into human trafficking in Cura\xE7\
  ao"
