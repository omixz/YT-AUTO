topics:
- The bizarre 1980 case of Zigmund Adamski, a coal miner who went out to buy groceries
  and was found dead five days later atop a 10-foot-high coal pile, with strange chemical
  burns on his neck and an expression of pure terror.
- The agonizing mystery of the Carroll A. Deering, a massive five-masted schooner
  found hard aground off Cape Hatteras in 1921 with its sails set, food laid out on
  the tables, and the ship's cat left entirely alone.
