topics:
- The 1910 disappearance of Dorothy Arnold, a wealthy New York socialite who walked
  into a busy Fifth Avenue bookstore in broad daylight, told a friend she was heading
  home to write a novel, and vanished completely into the afternoon crowd without
  leaving a single trace
- The haunting 1911 disappearance of Amy Ayling from a mental health facility in England,
  where her locked room was found completely empty except for her winter coat neatly
  draped over the foot of the bed and her boots still standing upright by the door
  as if she stepped right out of her skin
