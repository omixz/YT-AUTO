topics:
- The 1982 mysterious disappearance of 20-year-old nurse Paula Welden from a Vermont
  hiking trail, where dozens of searchers walked right past her bootprints in the
  fresh mud before she vanished entirely into a dense forest, leaving behind an open
  dormitory room with her bed unmade and a half-written letter on her desk.
- The 1966 disappearance of Richard Colvin Cox, a West Point cadet who walked off
  campus to meet a mysterious man named "George," vanished into thin air, and whose
  classified FBI file remained sealed for decades despite a trail of letters sent
  to his frantic parents from across the country.
- "The chilling 1945 Sodder family Christmas Eve fire in Fayetteville, West Virginia,\
  \ where a massive blaze burned down a family home, but when the ashes cooled, the\
  \ bodies of five missing children were entirely gone\u2014sparking a decades-long\
  \ desperate search fueled by a cryptic photograph mailed to the grieving parents\
  \ years later."
- The haunting 1981 disappearance of 16-year-old Dannette and 15-year-old Jeannette
  Milliken, two sisters who walked out of their Washington, D.C. home to go to the
  store in broad daylight, and simply evaporated from a crowded city street while
  carrying a handful of groceries.
