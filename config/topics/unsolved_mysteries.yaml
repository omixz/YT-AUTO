topics:
- "The 1912 disappearance of Bobby Dunbar, the 4-year-old boy who vanished during\
  \ a family fishing trip, only to be \"found\" months later\u2014prompting a heartbroken\
  \ mother to tearfully insist the child returned to her arms was a complete stranger,\
  \ a claim proven true nearly a century later by DNA."
- The bizarre 1969 disappearance of activist Ray Gricar, District Attorney of Centre
  County, Pennsylvania, who drove out for a quiet Friday afternoon lunch, abandoned
  his pristine car unlocked by a riverbank with his laptop and cell phone locked safely
  inside, and vanished without a trace, leaving behind a hard drive deliberately hurled
  into a distant stream.
- The chilling 1994 disappearance of Luke Durbin, a 19-year-old who walked out of
  an English nightclub in the early hours of the morning, spoke briefly to a stranger
  on a CCTV camera, and walked straight off the face of the earth, leaving behind
  a set of house keys and a wallet that were mysteriously mailed back to his home
  years later.
