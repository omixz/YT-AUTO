topics:
- 'The blinding of Samson by the Philistines: how a broken vow of hair led to his
  eyes being gouged out with hot irons, ending in a final, suicidal act of mass slaughter
  inside a collapsing pagan temple.'
- 'The cosmic theft of the Me: how Inanna seduced the god of wisdom with alcohol to
  steal the divine blueprints of civilization, fleeing down the Euphrates in a high-stakes
  boat chase as monsters were sent to reclaim them.'
