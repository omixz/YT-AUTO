topics:
- 'The blinding of Samson by the Philistines: how a broken vow of hair led to his
  eyes being gouged out with hot irons, ending in a final, suicidal act of mass slaughter
  inside a collapsing pagan temple.'
- 'The horrific curse of Phineus: how a blind prophet was starved to the brink of
  death by Harpies who violently defiled his food every time he tried to eat, until
  two winged demigods hunted them down.'
- 'The cosmic theft of the Me: how Inanna seduced the god of wisdom with alcohol to
  steal the divine blueprints of civilization, fleeing down the Euphrates in a high-stakes
  boat chase as monsters were sent to reclaim them.'
- 'The agonizing punishment of Prometheus: not just the eagle tearing his liver, but
  the psychological torture of Zeus chaining him to a freezing mountain peak where
  he was forced to watch humanity suffer from afar while refusing to reveal the secret
  of Zeus''s own downfall.'
