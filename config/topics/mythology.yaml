topics:
- 'The Blind Execution of Orpheus: How the grief-stricken musician was torn limb from
  limb by frenzied Thracian women in a brutal, blood-drenched frenzy after he turned
  his back on the worship of Dionysus'
- 'The Curse of the Golden Fleece: How the theft of a sacred sheepskin triggered a
  spiral of infanticide, royal madness, and a betrayed Medea slaughtering her own
  children in a chariot of fire'
- 'The Execution of King Pausanias: The paranoid Spartan general who starved to death
  inside the Temple of Athena after his own mother laid the first brick to seal him
  alive within its walls'
