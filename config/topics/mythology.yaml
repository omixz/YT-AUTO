topics:
- 'The Execution of the Vestal Virgin Cornelia: How a sacred Roman priestess, accused
  of breaking her vow of chastity, was buried alive in an underground chamber with
  only a crust of bread and a single cup of water while the city watched in silence.'
- 'The Flayed Skin of Marsyas: How a cocky satyr challenged the god Apollo to a musical
  duel, lost, and was skinned alive in a brutal demonstration of divine ego and vengeance.'
