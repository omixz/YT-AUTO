channel:
  name: "My Faceless Channel"
  niche: "bite-sized science and history facts"
  audience: "curious adults who scroll shorts"
  tone: "punchy, upbeat, slightly dramatic, no filler"
  language: "en"

video:
  format: shorts               # shorts (9:16, <=60s) or longform (16:9)
  target_seconds: 45
  resolution_shorts: [1080, 1920]
  resolution_longform: [1920, 1080]
  fps: 30
  background_music: null       # path to an mp3 under youtube-automation/assets, optional
  music_volume_db: -22

voice:
  provider: edge-tts
  name: en-US-GuyNeural        # run `edge-tts --list-voices` for options
  rate: "+0%"
  pitch: "+0Hz"

visuals:
  provider: pexels
  orientation: portrait        # portrait or landscape, should match video.format
  min_clip_seconds: 3

upload:
  privacy_status: public       # private | unlisted | public - "public" is required for true set-and-forget;
                                # switch to "private"/"unlisted" if you want to review before anything goes live
  category_id: "27"            # 27 = Education, see https://developers.google.com/youtube/v3/docs/videoCategories
  default_tags: ["shorts", "facts", "education"]
  made_for_kids: false

topics:
  queue_file: config/topics.yaml
  history_file: config/topic_history.json
