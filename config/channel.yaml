channel:
  name: "My Faceless Channel"
  audience: "curious adults who scroll shorts and watch longform"   # default; a niche below can override this
  tone: "dramatic, high-stakes, suspenseful, no filler"              # default; a niche below can override this
  language: "en"
  subscribe_cta: "for more {niche} every week"   # {niche} filled in from whichever niche was picked; shown on the outro card

# One channel, multiple niches. Every run, niche_selector.py picks one
# (niche, format) pair - weighted by past performance once enough data
# exists (see `growth:` below), falling back to these `weight` priors
# and round-robin exploration until then. Add/remove niches freely; each
# gets its own topic queue/history under config/topics/<key>.* and
# config/topic_history/<key>.json.
niches:
  - key: unsolved_mysteries
    niche: "unsolved mysteries and cold cases"
    tone: "dramatic, suspenseful, high-stakes"
    weight: 1.4   # mystery/true-crime content retains materially better than general facts
                  # content on YouTube (real-world retention data puts it well above the
                  # platform average) - nudges the cold-start prior while data accumulates;
                  # the bandit will correct this automatically once real analytics kick in
  - key: dark_history
    niche: "history's darkest, strangest, and most shocking moments"
    tone: "dramatic, high-stakes, told like a mini-documentary"
    weight: 1.2
  - key: world_wars
    niche: "pivotal moments, decisions, and turning points of World War I and World War II"
    tone: "dramatic, high-stakes, cause-and-effect - one decision that changed everything"
    weight: 1.2
  - key: modern_history
    niche: "consequential decisions and turning points of 20th-21st century history"
    tone: "dramatic, high-stakes, cause-and-effect - one decision that changed everything"
    weight: 1.0
  - key: ancient_civilizations
    niche: "what daily life was actually like in ancient empires and civilizations (Rome, Egypt, Persia, the Maya, and beyond)"
    tone: "vivid, immersive, you-are-there curiosity - what it actually felt like to live it"
    weight: 1.2
  - key: mythology
    niche: "Greek, Norse, Egyptian, and other mythology retold as gripping stories"
    tone: "dramatic, mythic, larger-than-life storytelling"
    weight: 1.2

video:
  fps: 30
  background_music: null       # path to an mp3 under youtube-automation/assets, optional
  music_volume_db: -16         # dB below narration; with amix normalize=0 this is the real level
  sfx_volume_db: -14           # scene-matched ambience level below narration
  resolution_shorts: [1080, 1920]
  resolution_longform: [1920, 1080]
  formats:
    shorts:
      enabled: true             # built with the same toon cartoon engine as longform; scheduled by its own cron in publish.yml
      target_seconds: 40        # the model overshoots Shorts ~1.5x (a 55s target ran 83s in the dry-run); 40 lands around 55-60s
      weight: 0.0               # 0 = the daily longform bandit never picks it; the Shorts cron forces --format shorts
    longform:
      enabled: true
      # 1200s = 20 min. Was previously running successfully in production
      # at this length (real precedent, not just a theoretical budget
      # calculation) before it got temporarily reduced to ~7 min - see
      # script_writer.py's generate_script for the scene-count/output-token
      # caps that were left capping it back down even after this value
      # changes. gemini-3.5-flash's real output ceiling is 65,536 tokens,
      # confirmed against Google's published model card - comfortably
      # covers a 20-minute script.
      target_seconds: 1200
      weight: 1.0

voice:
  # Google Cloud TTS Neural2 voices - noticeably more natural than edge-tts,
  # 1M characters/month free (a daily longform script is ~15-25K chars, so
  # this covers daily use with room to spare). Requires GOOGLE_TTS_API_KEY;
  # tts.py automatically falls back to edge-tts if that secret isn't set,
  # so this is safe to leave here even before the key is configured.
  provider: kokoro        # free open-source Kokoro-82M on CPU, no key or billing; falls back to edge-tts for the whole video on any failure
  name: am_michael        # warm US male narrator (try bm_george for British documentary). Google/edge-tts: set provider + a Neural2/edge voice name
  rate: "+12%"            # Kokoro at +0% reads ~126 wpm; +12% gives a documentary ~140 wpm
  words_per_minute: 155   # measured pace of this voice (dry-run: 896s vs 900s needed at 140) - script targets and the length gate use it; edge/Google voices run ~165
  pitch: "+0Hz"

visuals:
  provider: pexels             # real stock footage/photos - shorts use it directly; longform uses it as the backdrop behind animation.py's overlay
  orientation: portrait        # portrait or landscape, kept in sync with the chosen format at runtime
  min_clip_seconds: 3

animation:
  fps: 24                        # longform's procedural overlay runs at a lower fps than stock video - plenty smooth for simple shapes, much faster to render
  accent_color: [255, 255, 255]  # white stick figure / icon, composited via colorkey onto real footage
  engine: toon                   # toon = animated cartoon characters (falls back to legacy per scene on any failure) | legacy

upload:
  privacy_status: public       # private | unlisted | public - "public" is required for true set-and-forget;
                                # switch to "private"/"unlisted" if you want to review before anything goes live
  category_id: "27"            # 27 = Education, see https://developers.google.com/youtube/v3/docs/videoCategories
  default_tags: ["facts", "education"]
  made_for_kids: false
  crosspost_tiktok: false      # OFF until the TikTok probe (Actions -> TikTok probe) passes, then set true. TikTok exists to feed YouTube.
  tiktok_hashtags: "#history #storytime #didyouknow #fyp"

quality:
  min_words: 90                # below this, a script reads as too thin to be "produced content" (shorts baseline; longform naturally clears this)
  min_scenes: 6
  require_hook_and_insight: true   # first scene must be role=hook, last must be role=insight
  fallback_privacy_status: private # used only when on_gate_failure is "private"
  min_length_fraction: 0.60        # was hard-coded 0.75. The model writes ~2000 words against the 3100-word / 20-min target (2 of the last 3 mythology videos went private at 0.68); 0.60 = 12 min, still mid-roll eligible, and still catches truncated scripts
  max_script_attempts: 1           # extra whole-script regenerations on a text-gate failure (generate_script already retries length internally; Gemini free tier is ~20 calls/day)
  on_gate_failure: private         # private = upload privately for review (safe default) | skip = never upload a failed video, no human needed (topic kept) - switch to skip once real runs pass the gate

topics:
  queue_file: "config/topics/{niche}.yaml"
  history_file: "config/topic_history/{niche}.json"
  use_trending: true    # brainstorm from real current trending news/stories (Gemini + Google Search grounding) when the queue is empty, falling back to un-grounded brainstorming if that fails

growth:
  stats_file: config/performance_stats.json
  maturity_days: 7              # how long a video's stats need to settle before it counts toward the bandit
  epsilon: 0.2                  # fraction of runs that explore rather than exploit the current best (niche, format)
  min_samples_for_trust: 3      # a (niche, format) needs this many matured videos before its average score is trusted
